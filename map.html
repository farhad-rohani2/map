<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نقشه مدارس - مدیریت پیشرفته</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f6f8;color:#222;overflow:hidden}
        #app{display:flex;height:100vh;width:100vw}
        #sidebar{
            width:420px; background:#fff; overflow:auto; padding:16px;
            box-shadow:0 0 15px #0002; z-index:1000;
            transition: transform 0.3s ease; height:100vh; position:relative; flex-shrink:0;
        }
        #map{flex:1;height:100vh;position:relative}
        #hamburger{
            position:fixed; top:12px; right:12px; z-index:2000;
            background:#1976d2; color:white; border:none; border-radius:8px;
            padding:10px 12px; font-size:24px; line-height:1; cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.3); display:none;
        }
        #hamburger:hover{background:#1565c0}
        #sidebar-overlay{display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); z-index:999}
        h1{font-size:20px;margin:0 0 14px}
        h2{font-size:16px;margin:18px 0 8px}
        .box{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px;background:#fafafa}
        button,input,select,textarea{font-family:inherit;font-size:13px}
        button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;background:#1976d2;color:white;margin:3px}
        button.secondary{background:#666}
        button.success{background:#198754}
        button.warning{background:#d98c00}
        button.danger{background:#c62828}
        button.info{background:#0dcaf0;color:#000}
        button:disabled{opacity:0.5;cursor:not-allowed}
        input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;margin:4px 0 8px;background:white}
        textarea{min-height:70px;resize:vertical}
        label{font-size:12px;color:#555;display:block;margin-top:6px}
        .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
        .stat-item{background:#f0f2f5;padding:8px;border-radius:8px;text-align:center}
        .stat-item b{display:block;font-size:18px}
        .stat-item .label{font-size:11px;color:#666}
        .school-popup{min-width:280px;direction:rtl;max-height:450px;overflow:auto}
        .school-popup h3{margin:0 0 8px;font-size:16px}
        .school-popup table{width:100%;font-size:12px}
        .school-popup td{padding:3px}
        .school-popup td:first-child{font-weight:bold;width:35%}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
        .route-item{padding:8px;border-bottom:1px solid #eee;font-size:13px}
        .muted{color:#777;font-size:12px}
        #message{padding:8px;border-radius:8px;background:#eef5ff;margin-top:8px;font-size:12px}
        .leaflet-popup-content-wrapper{border-radius:12px}
        .route-badge{background:#1976d2;color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-weight:bold;border:2px solid white;box-shadow:0 1px 5px #0005}
        .filter-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
        .filter-group{margin-bottom:6px}
        .filter-group select{font-size:12px;padding:6px}
        .geocode-pending{background:#fff3cd;border:1px solid #ffc107;padding:8px;border-radius:6px;margin:6px 0}
        .geocode-pending .status{color:#856404;font-size:12px}
        .coords-info{font-size:11px;color:#666;margin:4px 0;padding:4px;background:#f8f9fa;border-radius:4px}
        .coords-info .new-coords{color:#d98c00;font-weight:bold}
        .coords-info .verified-coords{color:#198754;font-weight:bold}
        @media (max-width: 768px) {
            #sidebar{position:fixed;top:0;right:0;width:88vw;max-width:380px;height:100vh;transform:translateX(100%);box-shadow:0 0 25px rgba(0,0,0,0.3);z-index:1000;flex-shrink:0}
            #sidebar.open{transform:translateX(0)}
            #sidebar-overlay.open{display:block}
            #hamburger{display:block}
            #map{height:100vh;width:100vw}
            #app{flex-direction:row}
            .stats-grid{grid-template-columns:repeat(2,1fr)}
        }
        @media (min-width: 769px) {
            #sidebar{transform:translateX(0)!important;position:relative;display:block}
            #sidebar-overlay{display:none!important}
            #hamburger{display:none!important}
        }
        .geocoded-marker{filter: hue-rotate(30deg) saturate(1.5);}
    </style>
</head>

<body>
<button id="hamburger" onclick="toggleSidebar()">☰</button>
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="app">
    <aside id="sidebar">
        <h1>🗺️ مدیریت مدارس</h1>

        <!-- بخش آمار -->
        <div class="box">
            <h2>📊 آمار کلی</h2>
            <div class="stats-grid" id="statsContainer">
                <div class="stat-item"><b id="totalCount">0</b><span class="label">کل مدارس</span></div>
                <div class="stat-item"><b id="verifiedCount">0</b><span class="label">مختصات دقیق</span></div>
                <div class="stat-item"><b id="geocodedCount">0</b><span class="label">مختصات تقریبی</span></div>
                <div class="stat-item"><b id="withoutCoords">0</b><span class="label">بدون مختصات</span></div>
                <div class="stat-item"><b id="visitedCount">0</b><span class="label">بازدید شده</span></div>
            </div>
            <button class="info" onclick="loadStats()" style="width:100%;margin-top:6px">🔄 بروزرسانی آمار</button>
        </div>

        <!-- بخش فیلترها -->
        <div class="box">
            <h2>🔍 فیلترهای پیشرفته</h2>
            <div class="filter-group">
                <label>جستجو در همه فیلدها</label>
                <input id="searchInput" placeholder="نام، آدرس، شهر، ..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label>نوع مدرسه</label>
                <select id="filterSchoolType" onchange="applyFilters()"><option value="">همه</option></select>
            </div>
            <div class="filter-group">
                <label>جنسیت</label>
                <select id="filterSex" onchange="applyFilters()"><option value="">همه</option></select>
            </div>
            <div class="filter-group">
                <label>مقطع تحصیلی</label>
                <select id="filterSection" onchange="applyFilters()"><option value="">همه</option></select>
            </div>
            <div class="filter-group">
                <label>شهر</label>
                <select id="filterCity" onchange="applyFilters()"><option value="">همه</option></select>
            </div>
            <div class="field-row">
                <div class="filter-group">
                    <label>حداقل امتیاز</label>
                    <input type="number" id="filterMinScore" value="0" onchange="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>حداکثر امتیاز</label>
                    <input type="number" id="filterMaxScore" value="999999" onchange="applyFilters()">
                </div>
            </div>
            <div class="field-row">
                <div class="filter-group">
                    <label>خوابگاه</label>
                    <select id="filterDorm" onchange="applyFilters()">
                        <option value="">همه</option>
                        <option value="true">دارد</option>
                        <option value="false">ندارد</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>کتابخانه</label>
                    <select id="filterLibrary" onchange="applyFilters()">
                        <option value="">همه</option>
                        <option value="true">دارد</option>
                        <option value="false">ندارد</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="filter-group">
                    <label>آزمایشگاه</label>
                    <select id="filterLab" onchange="applyFilters()">
                        <option value="">همه</option>
                        <option value="true">دارد</option>
                        <option value="false">ندارد</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>کلاس هوشمند</label>
                    <select id="filterSmart" onchange="applyFilters()">
                        <option value="">همه</option>
                        <option value="true">دارد</option>
                        <option value="false">ندارد</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="warning" onclick="applyFiltersAndZoom()">🔍 اعمال و زوم</button>
                <button class="secondary" onclick="resetFilters()">پاک کردن</button>
                <button class="info" onclick="loadFilterFields()">🔄 بارگذاری فیلترها</button>
                <button class="success" onclick="geocodeAllSchools()" style="margin-top:5px;">🌍 تبدیل همه آدرس‌ها</button>
                <button class="success" onclick="geocodeMissing()" style="margin-top:5px;">📍 تبدیل در محدوده</button>
            </div>
        </div>

        <!-- بخش مسیر -->
        <div class="box">
            <h2>🚗 مسیر بازدید</h2>
            <div class="muted">روی مارکر کلیک کنید و «افزودن به مسیر» را بزنید.</div>
            <label>مبدأ</label>
            <select id="startMode">
                <option value="first">اولین مدرسه</option>
                <option value="mapcenter">مرکز نقشه</option>
            </select>
            <button class="warning" onclick="optimizeRoute()">🚗 ساخت مسیر</button>
            <button class="secondary" onclick="clearRoute()">پاک کردن</button>
            <div id="routeList"></div>
        </div>

        <!-- بخش اطلاعات مدرسه -->
        <div class="box">
            <h2>🏫 اطلاعات مدرسه</h2>
            <div id="editArea" class="muted">روی یک مارکر کلیک کنید.</div>
        </div>
    </aside>
    <main id="map"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ============================================================
    // مدیریت سایدبار
    // ============================================================
    let sidebarOpen = false;
    function toggleSidebar(){
        sidebarOpen = !sidebarOpen;
        document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
        document.getElementById('sidebar-overlay').classList.toggle('open', sidebarOpen);
    }
    function closeSidebar(){
        if(window.innerWidth <= 768){
            sidebarOpen = false;
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        }
    }
    window.addEventListener('resize', ()=>{
        if(window.innerWidth > 768){
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
            sidebarOpen = true;
        }
    });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSidebar(); });

    // ============================================================
    // متغیرهای اصلی
    // ============================================================
    let schools = [];
    let displayedSchools = [];
    let markers = [];
    let selectedRoute = [];
    let routeLine = null;
    let currentSchoolIndex = null;
    let loadTimeout = null;
    let isGeocoding = false;

    const map = L.map('map', { zoomControl: true }).setView([36.214,58.81], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,
        attribution:'© OpenStreetMap'
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);

    // ============================================================
    // بارگذاری آمار
    // ============================================================
    async function loadStats() {
        try {
            const response = await fetch('index.php?action=get_stats');
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            document.getElementById('totalCount').textContent = data.total || 0;
            document.getElementById('verifiedCount').textContent = data.verified || 0;
            document.getElementById('geocodedCount').textContent = data.geocoded || 0;
            document.getElementById('withoutCoords').textContent = data.without_coords || 0;
            document.getElementById('visitedCount').textContent = schools.filter(s => s.visited).length || 0;
        } catch(e) {
            console.error('خطا در دریافت آمار:', e);
        }
    }

    // ============================================================
    // بارگذاری فیلدهای فیلتر
    // ============================================================
    async function loadFilterFields() {
        try {
            const response = await fetch('index.php?action=get_filter_fields');
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const fields = {
                'filterSchoolType': data.school_type || [],
                'filterSex': data.sex || [],
                'filterSection': data.section || [],
                'filterCity': data.city || [],
                'filterDorm': ['', 'true', 'false'],
                'filterLibrary': ['', 'true', 'false'],
                'filterLab': ['', 'true', 'false'],
                'filterSmart': ['', 'true', 'false']
            };

            for (const [id, values] of Object.entries(fields)) {
                const select = document.getElementById(id);
                if (!select) continue;
                const currentVal = select.value;
                select.innerHTML = '<option value="">همه</option>';
                for (const val of values) {
                    if (val === '') continue;
                    const displayVal = val === 'true' ? 'دارد' : val === 'false' ? 'ندارد' : val;
                    select.innerHTML += `<option value="${val}">${displayVal}</option>`;
                }
                if (currentVal) select.value = currentVal;
            }
        } catch(e) {
            console.error('خطا در دریافت فیلترها:', e);
        }
    }

    // ============================================================
    // بارگذاری مدارس از سرور
    // ============================================================
    async function loadFromServer() {
        try {
            const bounds = map.getBounds();
            const search = document.getElementById('searchInput').value.trim();

            const filters = {
                school_type: document.getElementById('filterSchoolType').value,
                sex: document.getElementById('filterSex').value,
                section: document.getElementById('filterSection').value,
                city: document.getElementById('filterCity').value,
                min_score: parseFloat(document.getElementById('filterMinScore').value) || 0,
                max_score: parseFloat(document.getElementById('filterMaxScore').value) || 999999,
                dorm: document.getElementById('filterDorm').value,
                library: document.getElementById('filterLibrary').value,
                lab: document.getElementById('filterLab').value,
                smart_class: document.getElementById('filterSmart').value
            };

            const params = new URLSearchParams({
                action: 'get_schools',
                north: bounds.getNorth(),
                south: bounds.getSouth(),
                east: bounds.getEast(),
                west: bounds.getWest(),
                search: search,
                filters: JSON.stringify(filters)
            });

            const url = 'index.php?' + params.toString();
            const response = await fetch(url);
            if (!response.ok) throw new Error('خطا در دریافت داده');
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            schools = data;
            normalizeSchools();
            applyLocalEdits();
            renderMarkers();
            updateStats();      // آمار را از داده‌های محلی به‌روز می‌کند
            loadStats();        // آمار را از سرور می‌گیرد (برای اعداد کلی)

            if (data.length === 0) {
                msg('⚠️ هیچ مدرسه‌ای در محدوده فعلی یافت نشد. محدوده را تغییر دهید یا فیلترها را پاک کنید.', true);
            } else {
                msg(`✅ ${data.length} مدرسه در محدوده فعلی`);
            }
        } catch(e) {
            msg('❌ خطا: ' + e.message, true);
            console.error(e);
        }
    }

    // بارگذاری اولیه
    loadFromServer();
    loadFilterFields();
    loadStats();

    // بارگذاری مجدد با حرکت نقشه (با debounce)
    map.on('moveend', function(){
        clearTimeout(loadTimeout);
        loadTimeout = setTimeout(loadFromServer, 500);
    });

    // ============================================================
    // توابع اصلی
    // ============================================================
    function normalizeSchools(){
        schools = schools.map((s,i)=>{
            s.__index = i;
            s.lat = parseFloat(s.lat);
            s.lng = parseFloat(s.lng);
            if (isNaN(s.lat) || isNaN(s.lng) || (s.lat===0 && s.lng===0)) {
                s.lat = undefined; s.lng = undefined;
            }
            s.visited = !!s.visited;
            s.notes = s.notes || '';
            s.visit_date = s.visit_date || '';
            s.contact_result = s.contact_result || '';
            s.priority = s.priority || '';
            s.follow_up = s.follow_up || '';
            s._geocoded = !!s._geocoded;
            s._coords_verified = !!s._coords_verified;
            s._geocode_status = s._geocode_status || (s._coords_verified ? 'verified' : (s._geocoded ? 'pending' : 'none'));
            return s;
        });
    }

    function renderMarkers(){
        markerLayer.clearLayers();
        markers = [];
        displayedSchools = schools.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));

        displayedSchools.forEach((s, idx) => {
            let color = '#1976d2';
            let label = '';
            if (s._geocode_status === 'pending' && s._geocoded) {
                color = '#f97316';
                label = '?';
            } else if (s._coords_verified) {
                color = '#198754';
            }
            if (s.visited) label = '✓';

            const icon = L.divIcon({
                html: `<div style="background:${color};width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 0 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:12px;color:white;font-weight:bold;line-height:1;">${label}</div>`,
                iconSize: [24,24],
                iconAnchor: [12,12],
                className: (s._geocode_status === 'pending' && s._geocoded) ? 'geocoded-marker' : ''
            });

            const m = L.marker([s.lat, s.lng], { icon }).addTo(markerLayer);
            m.on('click', ()=>openSchool(s.__index, m));
            markers.push(m);
        });
        updateStats();
    }

    function openSchool(i, m){
        currentSchoolIndex = i;
        const s = schools[i];
        if(!s) return;

        let coordsInfo = '';
        if (s._geocode_status === 'pending' && s._geocoded) {
            coordsInfo = `
            <div class="geocode-pending">
                <div class="status">⚠️ این موقعیت بر اساس آدرس تخمین زده شده است</div>
                <div class="coords-info">
                    <span class="new-coords">📍 ${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}</span>
                    <button class="success" onclick="verifyCoords(${i})" style="padding:4px 10px;font-size:11px;margin:4px 0">✅ تایید مختصات</button>
                </div>
                ${s._geocode_info?.display_name ? `<div style="font-size:10px;color:#666;">${esc(s._geocode_info.display_name)}</div>` : ''}
            </div>
        `;
        } else if (s._coords_verified) {
            coordsInfo = `
            <div style="background:#d1e7dd;padding:6px;border-radius:6px;margin:4px 0">
                <span style="color:#198754;font-weight:bold;">✅ مختصات تایید شده</span>
                <div style="font-size:11px;color:#666;">${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}</div>
            </div>
        `;
        }

        const popup = `
    <div class="school-popup">
        <h3>🏫 ${esc(s.name || 'بدون نام')}</h3>
        <table>
            <tr><td>مقطع:</td><td>${esc(s.section || s.section_title || '')}</td></tr>
            <tr><td>جنسیت:</td><td>${esc(s.sex || s.sex_title || '')}</td></tr>
            <tr><td>نوع:</td><td>${esc(s.school_type || s.school_type_title || '')}</td></tr>
            <tr><td>شهر:</td><td>${esc(s.city || s.city_title || '')}</td></tr>
            <tr><td>آدرس:</td><td>${esc(s.address || '')}</td></tr>
            <tr><td>تلفن:</td><td>${esc(s.phone1 || '')}</td></tr>
            <tr><td>امتیاز:</td><td>${esc(s.score ?? '')}</td></tr>
            <tr><td>بازدید:</td><td>${s.visited ? '✅ بله' : '❌ خیر'}</td></tr>
        </table>
        ${coordsInfo}
        <hr>
        <button onclick="addToRoute(${i})">➕ افزودن به مسیر</button>
        <button class="success" onclick="editSchool(${i})">✏️ ویرایش</button>
        <button class="secondary" onclick="markVisited(${i})">${s.visited ? '↩️ لغو' : '✅ ثبت بازدید'}</button>
        ${(!s.lat || !s.lng) && s.address ? `<button class="warning" onclick="geocodeSingle(${i})" style="font-size:11px;padding:4px 8px;">🌍 تبدیل دقیق آدرس</button>` : ''}
    </div>`;
        m.bindPopup(popup).openPopup();
        showEditForm(i);
    }

    // ============================================================
    // تبدیل آدرس به مختصات (تک مدرسه)
    // ============================================================
    async function geocodeSingle(i) {
        const s = schools[i];
        if (!s || !s.address) {
            msg('❌ این مدرسه آدرسی ندارد', true);
            return;
        }

        if (isGeocoding) {
            msg('⏳ در حال پردازش... لطفاً صبر کنید', true);
            return;
        }

        isGeocoding = true;
        msg('🌍 در حال تبدیل آدرس به مختصات...');

        try {
            const response = await fetch(`index.php?action=geocode_single&id=${s.id}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const idx = schools.findIndex(sch => sch.id === data.id);
            if (idx !== -1) {
                schools[idx] = data;
                normalizeSchools();
                renderMarkers();
                updateStats();
                const marker = markers.find(m => {
                    const p = m.getLatLng();
                    return Math.abs(p.lat - data.lat) < 1e-9 && Math.abs(p.lng - data.lng) < 1e-9;
                });
                if (marker) marker.openPopup();
                msg('✅ مختصات جدید پیدا شد. برای تایید، روی دکمه "تایید مختصات" کلیک کنید.');
            }
        } catch(e) {
            msg('❌ خطا: ' + e.message, true);
        }
        isGeocoding = false;
    }

    // ============================================================
    // تبدیل دسته‌جمعی آدرس‌ها (مدارس بدون مختصات در محدوده)
    // ============================================================
    async function geocodeMissing() {
        const bounds = map.getBounds();
        const missing = schools.filter(s => {
            const hasCoord = Number.isFinite(s.lat) && Number.isFinite(s.lng) && s.lat != 0 && s.lng != 0;
            if (hasCoord) return false;
            if (!s.address) return false;
            if (s._geocoded_lat && s._geocoded_lng) {
                return bounds.contains([parseFloat(s._geocoded_lat), parseFloat(s._geocoded_lng)]);
            }
            return true;
        });

        if (missing.length === 0) {
            msg('✅ هیچ مدرسه‌ای بدون مختصات در محدوده‌ی فعلی وجود ندارد.');
            return;
        }

        if (!confirm(`آیا ${missing.length} مدرسه بدون مختصات در محدوده‌ی فعلی را تبدیل کنید؟`)) return;

        let successCount = 0;
        for (const s of missing) {
            try {
                const response = await fetch(`index.php?action=geocode_single&id=${s.id}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const idx = schools.findIndex(sch => sch.id === data.id);
                if (idx !== -1) {
                    schools[idx] = data;
                    successCount++;
                }
            } catch (e) {
                console.warn(`خطا برای مدرسه ${s.name}:`, e);
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
        }

        normalizeSchools();
        renderMarkers();
        updateStats();
        msg(`✅ ${successCount} از ${missing.length} مدرسه با موفقیت تبدیل شدند.`);
        loadStats();
    }

    // ============================================================
    // تبدیل همه مدارس بدون مختصات (اکشن جدید بک‌اند)
    // ============================================================
    async function geocodeAllSchools() {
        if (!confirm('آیا همه مدارس فاقد مختصات را تبدیل می‌کنید؟ این عمل ممکن است چند دقیقه طول بکشد.')) return;

        msg('⏳ در حال تبدیل همه مدارس... لطفاً صبر کنید.');
        try {
            const response = await fetch('index.php?action=geocode_all');
            const result = await response.json();
            if (result.error) throw new Error(result.error);

            let message = `✅ تبدیل کامل شد.\n`;
            message += `کل مدارس: ${result.total}\n`;
            message += `موفق: ${result.success}\n`;
            message += `ناموفق: ${result.failed}\n`;
            message += `از قبل دارای مختصات: ${result.already_had_coords}\n`;
            if (result.errors && result.errors.length > 0) {
                message += `\n❌ خطاها:\n`;
                result.errors.forEach(e => {
                    message += `- ${e.name}: ${e.reason}\n`;
                });
            }
            alert(message);
            msg(`✅ ${result.success} مدرسه با موفقیت تبدیل شدند.`);
            // بارگذاری مجدد داده‌ها
            loadFromServer();
            loadStats();
        } catch(e) {
            msg('❌ خطا: ' + e.message, true);
        }
    }

    // ============================================================
    // تایید مختصات
    // ============================================================
    async function verifyCoords(i) {
        const s = schools[i];
        if (!s) return;

        try {
            const formData = new FormData();
            formData.append('action', 'verify_coords');
            formData.append('id', s.id);
            formData.append('lat', s.lat);
            formData.append('lng', s.lng);

            const response = await fetch('index.php', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.success) {
                s._coords_verified = true;
                s._geocode_status = 'verified';
                s._geocoded = false;
                if (s._geocoded_lat) delete s._geocoded_lat;
                if (s._geocoded_lng) delete s._geocoded_lng;
                saveLocalEdit(s);
                renderMarkers();
                updateStats();
                const marker = markers.find(m => {
                    const p = m.getLatLng();
                    return Math.abs(p.lat - s.lat) < 1e-9 && Math.abs(p.lng - s.lng) < 1e-9;
                });
                if (marker) marker.openPopup();
                msg('✅ مختصات تایید و ذخیره شد.');
            } else {
                msg('❌ خطا در تایید: ' + (result.error || ''), true);
            }
        } catch(e) {
            msg('❌ خطا: ' + e.message, true);
        }
    }

    async function saveSchool(i){
        const s = schools[i];
        s.notes = document.getElementById('e_notes').value;
        s.visit_date = document.getElementById('e_visit_date').value;
        s.priority = document.getElementById('e_priority').value;
        s.contact_result = document.getElementById('e_contact_result').value;
        s.follow_up = document.getElementById('e_follow_up').value;

        saveLocalEdit(s);

        try {
            const formData = new FormData();
            formData.append('action', 'save_school');
            formData.append('school', JSON.stringify({
                id: s.id,
                notes: s.notes,
                visit_date: s.visit_date,
                contact_result: s.contact_result,
                priority: s.priority,
                follow_up: s.follow_up,
                visited: s.visited
            }));

            const response = await fetch('index.php', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.success) {
                msg('✅ اطلاعات در سرور ذخیره شد.');
            } else {
                msg('❌ خطا در ذخیره: ' + (result.error || ''), true);
            }
        } catch(e) {
            msg('❌ خطا در ارتباط با سرور: ' + e.message, true);
        }
    }

    function markVisited(i){
        schools[i].visited = !schools[i].visited;
        saveLocalEdit(schools[i]);
        const marker = markers.find(m => {
            const p = m.getLatLng();
            const s = schools[i];
            return Math.abs(p.lat - s.lat) < 1e-9 && Math.abs(p.lng - s.lng) < 1e-9;
        });
        if(marker) marker.openPopup();
        renderMarkers();
        updateStats();
        showEditForm(i);
        msg(schools[i].visited ? '✅ بازدید ثبت شد' : '↩️ بازدید لغو شد');
    }

    function applyFilters(){
        clearTimeout(loadTimeout);
        loadTimeout = setTimeout(loadFromServer, 400);
    }

    function applyFiltersAndZoom(){
        const search = document.getElementById('searchInput').value.trim();
        const filters = {
            school_type: document.getElementById('filterSchoolType').value,
            sex: document.getElementById('filterSex').value,
            section: document.getElementById('filterSection').value,
            city: document.getElementById('filterCity').value,
            min_score: parseFloat(document.getElementById('filterMinScore').value) || 0,
            max_score: parseFloat(document.getElementById('filterMaxScore').value) || 999999,
            dorm: document.getElementById('filterDorm').value,
            library: document.getElementById('filterLibrary').value,
            lab: document.getElementById('filterLab').value,
            smart_class: document.getElementById('filterSmart').value
        };

        let filtered = schools.filter(s => {
            if(!Number.isFinite(s.lat)||!Number.isFinite(s.lng)) return false;
            if(search && !JSON.stringify(s).toLowerCase().includes(search.toLowerCase())) return false;
            if(filters.school_type && (s.school_type||s.school_type_title||'') !== filters.school_type) return false;
            if(filters.sex && (s.sex||s.sex_title||'') !== filters.sex) return false;
            if(filters.section && (s.section||s.section_title||'') !== filters.section) return false;
            if(filters.city && (s.city||s.city_title||'') !== filters.city) return false;
            if(s.score !== undefined && s.score !== null) {
                const score = parseFloat(s.score);
                if(score < filters.min_score || score > filters.max_score) return false;
            }
            if(filters.dorm !== '') {
                const dorm = s.dorm ? true : false;
                if(dorm !== (filters.dorm === 'true')) return false;
            }
            if(filters.library !== '') {
                const lib = s.library ? true : false;
                if(lib !== (filters.library === 'true')) return false;
            }
            if(filters.lab !== '') {
                const lab = s.lab ? true : false;
                if(lab !== (filters.lab === 'true')) return false;
            }
            if(filters.smart_class !== '') {
                const smart = s.smart_class ? true : false;
                if(smart !== (filters.smart_class === 'true')) return false;
            }
            return true;
        });

        if(filtered.length === 0){
            msg('❌ هیچ مدرسه‌ای با این فیلترها پیدا نشد.', true);
            return;
        }
        const bounds = L.latLngBounds(filtered.map(s=>[s.lat,s.lng]));
        map.fitBounds(bounds, {padding:[30,30]});
        msg(`🔍 ${filtered.length} مدرسه یافت شد.`);
    }

    function resetFilters(){
        document.getElementById('searchInput').value = '';
        document.getElementById('filterSchoolType').value = '';
        document.getElementById('filterSex').value = '';
        document.getElementById('filterSection').value = '';
        document.getElementById('filterCity').value = '';
        document.getElementById('filterMinScore').value = '0';
        document.getElementById('filterMaxScore').value = '999999';
        document.getElementById('filterDorm').value = '';
        document.getElementById('filterLibrary').value = '';
        document.getElementById('filterLab').value = '';
        document.getElementById('filterSmart').value = '';
        loadFromServer();
    }

    function updateStats(){
        // محاسبه آمار از داده‌های فعلی (مدارس بارگذاری شده در محدوده)
        const total = schools.length;
        let verified = 0, geocoded = 0, withoutCoords = 0;
        for (const s of schools) {
            const hasCoords = Number.isFinite(s.lat) && Number.isFinite(s.lng) && s.lat != 0 && s.lng != 0;
            if (hasCoords) {
                if (s._coords_verified) {
                    verified++;
                } else if (s._geocoded) {
                    geocoded++;
                }
            } else {
                withoutCoords++;
            }
        }
        document.getElementById('totalCount').textContent = total;
        document.getElementById('verifiedCount').textContent = verified;
        document.getElementById('geocodedCount').textContent = geocoded;
        document.getElementById('withoutCoords').textContent = withoutCoords;
        document.getElementById('visitedCount').textContent = schools.filter(s=>s.visited).length || 0;
    }

    function msg(t, error=false){
        const el = document.getElementById('message');
        el.textContent = t;
        el.style.background = error ? '#ffecec' : '#eef5ff';
    }

    function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function attr(v){ return esc(v).replace(/\n/g,' '); }

    // ============================================================
    // مدیریت مسیر
    // ============================================================
    function addToRoute(i){ if(!selectedRoute.includes(i)){ selectedRoute.push(i); updateRouteList(); updateStats(); } }
    function removeFromRoute(i){ selectedRoute = selectedRoute.filter(x=>x!==i); updateRouteList(); updateStats(); }
    function updateRouteList(){
        document.getElementById('routeList').innerHTML = selectedRoute.length ?
            selectedRoute.map((i,n)=>`<div class="route-item">${n+1}. ${esc(schools[i]?.name||'')} <button class="danger" style="float:left;padding:4px 7px" onclick="removeFromRoute(${i})">×</button></div>`).join('') :
            '<div class="muted">هیچ مدرسه‌ای انتخاب نشده.</div>';
    }

    async function optimizeRoute() {
        if (selectedRoute.length < 2) {
            msg('حداقل دو مدرسه برای مسیر‌یابی انتخاب کنید.', true);
            return;
        }

        let points = selectedRoute.map(i => {
            const s = schools[i];
            if (!s || !Number.isFinite(s.lat) || !Number.isFinite(s.lng)) return null;
            return { lat: s.lat, lng: s.lng, index: i };
        }).filter(p => p !== null);

        if (points.length < 2) {
            msg('برخی مدارس مختصات معتبر ندارند.', true);
            return;
        }

        const startMode = document.getElementById('startMode').value;
        let startIndex = 0;
        if (startMode === 'mapcenter') {
            const center = map.getCenter();
            let minDist = Infinity;
            points.forEach((p, idx) => {
                const d = map.distance([center.lat, center.lng], [p.lat, p.lng]);
                if (d < minDist) { minDist = d; startIndex = idx; }
            });
        }

        const ordered = [];
        const remaining = [...points];
        let current = remaining.splice(startIndex, 1)[0];
        ordered.push(current);

        while (remaining.length > 0) {
            let minDist = Infinity;
            let minIdx = 0;
            remaining.forEach((p, idx) => {
                const d = map.distance([current.lat, current.lng], [p.lat, p.lng]);
                if (d < minDist) { minDist = d; minIdx = idx; }
            });
            current = remaining.splice(minIdx, 1)[0];
            ordered.push(current);
        }

        routeLayer.clearLayers();
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }

        const latlngs = ordered.map(p => [p.lat, p.lng]);
        routeLine = L.polyline(latlngs, { color: '#d98c00', weight: 4, opacity: 0.8 }).addTo(map);
        routeLayer.addLayer(routeLine);
        map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

        const routeList = document.getElementById('routeList');
        routeList.innerHTML = ordered.map((p, idx) =>
            `<div class="route-item">${idx+1}. ${esc(schools[p.index]?.name || '')}</div>`
        ).join('');

        msg(`✅ مسیر بهینه با ${ordered.length} نقطه ساخته شد.`);
    }

    function clearRoute() {
        selectedRoute = [];
        routeLayer.clearLayers();
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        updateRouteList();
        updateStats();
        msg('مسیر پاک شد.');
    }

    // ============================================================
    // توابع کمکی
    // ============================================================
    function saveLocalEdit(s){
        try{
            const edits = JSON.parse(localStorage.getItem('schoolMapEdits')||'{}');
            const copy = {...s}; delete copy.__index;
            edits[s.id||s.code||s.name] = copy;
            localStorage.setItem('schoolMapEdits', JSON.stringify(edits));
        }catch(e){}
    }
    function applyLocalEdits(){
        try{
            const edits = JSON.parse(localStorage.getItem('schoolMapEdits')||'{}');
            schools.forEach(s=>{ if(edits[s.id]!=null) Object.assign(s, edits[s.id]); });
        }catch(e){}
    }
    function resetEdits(){
        if(confirm('تغییرات محلی پاک شود؟')){
            localStorage.removeItem('schoolMapEdits');
            schools.forEach(s=>{ s.visited=false; s.notes=''; s.visit_date=''; s.contact_result=''; s.priority=''; s.follow_up=''; });
            renderMarkers(); updateStats(); msg('تغییرات محلی پاک شد.');
        }
    }
    function downloadJSON(){
        if(!schools.length){ alert('داده‌ای وجود ندارد'); return; }
        const clean = schools.map(s=>{ const x={...s}; delete x.__index; return x; });
        const blob = new Blob([JSON.stringify(clean,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'schools-updated.json'; a.click(); URL.revokeObjectURL(a.href);
    }

    // ============================================================
    // راه‌اندازی اولیه

    updateRouteList();
